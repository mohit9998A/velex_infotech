<svg xmlns="http://www.w3.org/2000/svg" width="512" height="128" viewBox="0 0 512 128" role="img" aria-label="Velex Infotech">
  <title>Velex Infotech</title>
  <defs>
    <linearGradient id="vx-crystal" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="55%" stop-color="#6B21FF" />
      <stop offset="100%" stop-color="#E4C76B" />
    </linearGradient>
  </defs>

  <!-- Crystal mark: same geometry as components/common/logo.tsx, scaled 32 -> 96 and inset 16,16 -->
  <g transform="translate(16 16) scale(3)">
    <path d="M16 2 L27 11 L16 30 L5 11 Z" fill="url(#vx-crystal)" stroke="#F0EEFF" stroke-opacity="0.25" stroke-width="0.75" />
    <path d="M5 11 H27 M16 2 V30 M11 11 L16 30 L21 11" stroke="#04040A" stroke-opacity="0.35" stroke-width="0.6" fill="none" />
  </g>

  <!-- Wordmark -->
  <text x="128" y="80"
        font-family="Geist, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700" letter-spacing="-1.5" fill="#F0EEFF">VELEX<tspan fill="#A855F7">.</tspan></text>
</svg>
